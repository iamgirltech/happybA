<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday!</title>
  <style>
  body {
  background-image: url('876589.jpg'); /* caminho da imagem */
  background-size: cover; /* cobre toda a tela */
  background-repeat: no-repeat; /* não repete */
  font-family: cursive, sans-serif;
  text-align: center;
  margin-top: 100px;
  overflow: hidden;
}
    h1 {
      color: #c3c1d9;
      font-size: 3em;
    }
    .mensagem {
      font-size: 1.5em;
      color: #031d31;
    }

     .men {
      font-family: cursive, sans-serif;
      color: #cde2f1;
      text-shadow: 0 0 20px #c0a6e4; /* efeito de brilho */
    }

     .sim {
      font-family: roboto, monospace;
      color: #545357;
    }

      /* estilos da caixa de senha */
  input[type="password"] {
    padding: 12px;
    font-size: 1.2em; /* tamanho da fonte */
    font-family: 'Roboto Mono', monospace; /* família da fonte */
    border: 2px solid #010810;
    border-radius: 12px;
    outline: none;  
    background-color: #05182c;
    color: #eceff3;
    box-shadow: 2px 2px 10px rgba(202, 205, 211, 0.2);
    transition: 0.3s;
  }

  input[type="password"]:focus {
    border-color: #606163;
    background-color: #020508;
    box-shadow: 0 0 10px #3552b0;
  }

  button {
    padding: 10px 20px;
    font-size: 1.1em;
    border: none;
    border-radius: 10px;
    background-color: #080a0b;
    color: white;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background-color: #020b22;
  }
  
    /* estilo dos confetes */
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: red;
      opacity: 0.8;
      animation: fall 5s linear forwards;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(100vh) rotate(360deg); }
    }

    #conteudo {
      display: none; /* começa escondido */
    }
  </style>
</head>
<body>
  <audio id="musica" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>
  <br>
  <br>
  <br>
  <br>
  <br>
  <br>
  <h2 class="sim">Resolva a charada para ver a surpresa 🎁 <br> 
    (Pequeno e excêntrico, lembrado por um nome engraçado, <br> 
    uma voz aguda e por aparições inesperadas que surpreendem) </h2>
  <input type="password" id="senha" placeholder="Senha">
  <button onclick="verificarSenha()">Entrar</button>

 

  <div id="conteudo">
    <h1>Happy birthday, André! 🎉🎂</h1>
    <p class="mensagem">Continuo torcendo por você, mesmo que de longe!</p>
  </div>

  <script>
    function verificarSenha() {
     const senha = document.getElementById("senha").value.toLowerCase();
if (senha === "sr bunda cagada" || senha === "senhor bunda cagada") {
    // libera a surpresa
         document.getElementById("conteudo").style.display = "block";
         document.querySelector("h2.sim").style.display = "none"; // esconde a mensagem da senha
         document.getElementById("senha").style.display = "none"; // esconde a caixa de senha
         document.querySelector("button").style.display = "none"; // esconde o botão
         
    iniciarConfetes(); // começa os confetes


    // toca música após senha correta
   const audio = document.getElementById("musica");
audio.volume = 0.3; // começa baixinho
audio.play().catch(error => {
  console.log("Autoplay bloqueado, mas o clique já deve liberar:", error);
});

  // aumenta o volume gradualmente
  let volume = 0;
  const fadeIn = setInterval(() => {
    if (volume < 1) {
      volume += 0.05;
      audio.volume = Math.min(volume, 1);
    } else {
      clearInterval(fadeIn);
    }
  }, 200); // aumenta o volume a cada 200ms
  } 
else {
    alert("Senha incorreta!");
  }
    }

    function iniciarConfetes() {
      setInterval(createConfetti, 200);
    }

    function createConfetti() {
      const confetti = document.createElement("div");
      confetti.classList.add("confetti");

      // cores aleatórias
      const colors = ["#ff4d6d", "#4da6ff", "#66ff66", "#ffd633", "#cc66ff"];
      confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

      // posição horizontal aleatória
      confetti.style.left = Math.random() * window.innerWidth + "px";

      // tamanho aleatório
      const size = Math.random() * 8 + 5;
      confetti.style.width = size + "px";
      confetti.style.height = size + "px";

      // duração aleatória
      confetti.style.animationDuration = (3 + Math.random() * 3) + "s";

      document.body.appendChild(confetti);

      // remover depois que cair
      setTimeout(() => confetti.remove(), 6000);
    }
  </script>
</body>
</html>
